<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link rel="shortcut icon" href="../Images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/signUpStyles.css">
</head>
<body>

    <div class="outerFrame">
        <div class="innerFrame">
            <a href="">
                <img src="../images/logo_trpnt_bg.png" alt="logo-png">
            </a>
            <button id="toggleBtn" >Sign Up as <span id="regType">Driver</span></button>
        </div>
        <div class="innerFrame">
            <h3>Sign Up as <span id="regTopic">Customer</span></h3>
            <form action="" method="post">
                <fieldset>
                    <div class="formBlock">
                        <input type="text" name="firstName" id="firstName" placeholder="First Name ..">
                    </div>
                    <div class="formBlock">
                        <input type="text" name="lastName" id="lastName" placeholder="Last Name ..">
                    </div>
                    <div class="formBlock">
                        <input type="date" name="doB" id="doB">
                    </div>
                    <div class="formBlock">
                        <p>Gender</p>
                        <div class="gender">
                            <div class="genderBlock">
                                <input type="radio" name="gender" id="male" value="male">
                                <label for="male">Male</label>
                            </div>
                            <div class="genderBlock">
                                <input type="radio" name="gender" id="female" value="female">
                                <label for="female">Female</label>
                            </div>
                        </div>
                    </div>
                    <div class="formBlock">
                        <input type="text" name="nicNo" id="nicNo" value="NIC number ..">
                    </div>
                    <div class="formBlock">
                        <input type="text" name="licenceNo" id="licenceNo" value="Drvier's Licence number ..">
                    </div>
                    <div class="formBtn">
                        <button>next</button>
                    </div>
                </fieldset>
                <fieldset>
                    <div class="formBlock">
                        <textarea name="address" id="address" placeholder="Address .."></textarea>
                    </div>
                    <div class="formBlock">
                        <input type="tel" name="mobile" id="mobile" placeholder="Mobile number ..">
                    </div>
                    <div class="formBlock">
                        <input type="email" name="email" id="email" placeholder="Email address ..">
                    </div>
                    <div class="formBlock">
                        <label for="nicPDF">Scan of NIC <span>*pdf file</span></label>
                        <input type="file" name="nicPDF" id="nicPDF">
                    </div>
                    <div class="driverBlock">
                        <div class="formBlock">
                            <label for="nicPDF">Scan of NIC <span>*pdf file</span></label>
                            <input type="file" name="nicPDF" id="nicPDF">
                        </div>
                        <div class="formBlock">
                            <label for="nicPDF">Scan of Driver's Licence <span>*pdf file</span></label>
                            <input type="file" name="licencePDF" id="licencePDF">
                        </div>
                        <div class="formBlock">
                            <label for="nicPDF">Profile Picture <span>*jpg/png/jpeg file</span></label>
                            <input type="file" name="profileImage" id="profileImage">
                        </div>
                    </div>
                    <div class="formBtn">
                        <button>previous</button>
                        <button>next</button>
                    </div>
                </fieldset>
                <fieldset>
                    <div class="formBlock">
                        <p>Create a Password</p>
                        <input type="password" name="pwd" id="pwd" placeholder="Create password ..">
                        <label for="pwd">
                            <img id="" src="../images/eye-slash-solid.svg" alt="eye-slash-solid">
                        </label>
                    </div>
                    <div class="formBlock">
                        <p>Confirm your Password</p>
                        <input type="password" name="cPwd" id="cPwd" placeholder="Confirm password ..">
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
    
    <script>
        // change registration type
        let toggleBtn = document.getElementById('toggleBtn');

        toggleBtn.addEventListener('click', () => {
            let toggleValue = document.getElementById('regType');

            if(toggleValue.textContent == 'Customer')
            {
                toggleValue.textContent = 'Driver';
                document.body.style.backgroundImage = "url('../images/signUpAsClientBg.jpg')";
                document.getElementById('regTopic').textContent = 'Customer';
                document.querySelector('.driverBlock').style.display = 'none';
            }
            else
            {
                toggleValue.textContent = 'Customer';
                document.body.style.backgroundImage = "url('../images/signUpAsDriverBg.jpg')";
                document.getElementById('regTopic').textContent = 'Driver';
                document.querySelector('.driverBlock').style.display = 'flex';
            }
        })
    </script>

</body>
</html>
