<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Wander Wheel Rentals</title>
    <link rel="shortcut icon" href="../Images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="../styles/signUpStyles.css">
</head>
<body>

<div class="outerFrame">
    <div class="innerFrame">
        <a href="">
            <img src="../images/logo_trpnt_bg.png" alt="logo-png">
        </a>
        <button id="toggleBtn">Sign Up as <span id="regType">Driver</span></button>
    </div>
    <div class="innerFrame">
        <h3>Sign Up as <span id="regTopic">Customer</span></h3>
        <form action="./signUpAction.php" method="post" enctype="multipart/form-data">

            <!-- personal details -->
            <fieldset>
                <input type="hidden" id="reg_type" name="reg_type" value="customers">
                <div class="formBlock">
                    <input type="text" name="firstName" id="firstName" placeholder="First Name..." required>
                </div>
                <div class="formBlock">
                    <input type="text" name="lastName" id="lastName" placeholder="Last Name..." required>
                </div>
                <div class="formBlock">
                    <input type="date" name="doB" id="doB" required>
                </div>
                <div class="formBlock">
                    <p>Gender</p>
                    <div class="gender">
                        <div class="genderBlock">
                            <input type="radio" name="gender" id="male" value="male" required>
                            <label for="male">Male</label>
                        </div>
                        <div class="genderBlock">
                            <input type="radio" name="gender" id="female" value="female" required>
                            <label for="female">Female</label>
                        </div>
                    </div>
                </div>
                <div class="formBlock">
                    <input type="text" name="nicNo" id="nicNo" placeholder="NIC number..." required>
                </div>
                <div class="formBlock">
                    <input type="text" name="licenceNo" id="licenceNo" placeholder="Driver's Licence number..." required>
                </div>
                <div class="formBtn">
                    <button type="button" onclick="jumpToStep(1)">Next</button>
                </div>
            </fieldset>

            <!-- contact details -->
            <fieldset>
                <div class="formBlock">
                    <textarea name="address" id="address" placeholder="Address..." required></textarea>
                </div>
                <div class="formBlock">
                    <input type="tel" name="mobile" id="mobile" placeholder="Mobile number..." required>
                </div>
                <div class="formBlock">
                    <input type="email" name="email" id="email" placeholder="Email address..." required>
                </div>
                <div class="formBlock">
                    <label for="nicPDF">Scan of NIC <span>*pdf file</span></label>
                    <input type="file" name="nicPDF" id="nicPDF">
                </div>
                <div class="driverBlock">
                    <div class="formBlock">
                        <label for="licencePDF">Scan of Driver's Licence <span>*pdf file</span></label>
                        <input type="file" name="licencePDF" id="licencePDF">
                    </div>
                    <div class="formBlock">
                        <label for="profileImage">Profile Picture <span>*jpg/png/jpeg file</span></label>
                        <input type="file" name="profileImage" id="profileImage">
                    </div>
                </div>
                <div class="formBtn">
                    <button type="button" onclick="jumpToStep(0)">Previous</button>
                    <button type="button" onclick="jumpToStep(2)">Next</button>
                </div>
            </fieldset>

            <!-- password -->
            <fieldset>
                <div class="formBlock">
                    <p>Create a Password</p>
                    <input type="password" name="pwd" id="pwd" placeholder="Create password..." required>
                    <label for="pwd">
                        <img id="isVisible" src="../images/eye-slash-solid.svg" alt="eye-slash-solid">
                    </label>
                </div>
                <div class="formBlock">
                    <p>Confirm your Password</p>
                    <input type="password" name="cPwd" id="cPwd" placeholder="Confirm password..." required>
                </div>
                <div class="errorBlock formBlock" id="pwdError"></div>
                <div class="formBlock cPwdBlock" id="cPwdBox"></div>
                <div class="formBtn">
                    <button type="button" onclick="jumpToStep(1)">Previous</button>
                    <button id="submitBtn" type="submit">Submit</button>
                </div>
            </fieldset>
        </form>
    </div>
</div>

<script>
// Confirm password
let cPwd = document.getElementById('cPwd');
let submitBtn = document.getElementById('submitBtn');

cPwd.addEventListener('input', () => {
    let pwdText = document.getElementById('pwd').value;
    let warningBox = document.getElementById('cPwdBox');

    warningBox.innerHTML = '';
    
    if (pwdText === cPwd.value) {
        submitBtn.disabled = false;
    } else {
        submitBtn.disabled = true;
        warningBox.innerHTML = `<p>Passwords do not match.</p>`;
    }
});

// Instructions to password
let pwdIO = document.getElementById('pwd');
pwdIO.addEventListener('input', () => {
    let errorBlock = document.getElementById('pwdError');
    let pwdWarningArray = [];
    let pwdText = pwdIO.value;

    errorBlock.innerHTML = '';

    if (!/[A-Z]/.test(pwdText)) { // check whether password has any capital letters in it
        pwdWarningArray.push(`<p>Password must contain at least one CAPITAL letter.</p>`);
    }
    if (!/[!@#$%^&*(),.?":{}|<>]/.test(pwdText)) { // also check whether password has any special characters in it
        pwdWarningArray.push(`<p>Password must contain at least one Special Character.</p>`);
    }
    if (!/[0-9]/.test(pwdText)) { // again check whether password has any numbers in it
        pwdWarningArray.push(`<p>Password must contain at least one Numeric Character (0-9).</p>`);
    }
    if (pwdText.length < 8) { // also check does the password is longer than 8 characters
        pwdWarningArray.push(`<p>Password must be at least 8 characters long.</p>`);
    }

    errorBlock.innerHTML = pwdWarningArray.join('');
});

// Password visibility
let eyeBtn = document.getElementById('isVisible');
eyeBtn.addEventListener('click', () => {
    let obText = document.getElementById('pwd');
    if (obText.type === 'password') {
        obText.type = 'text';
        eyeBtn.src = '../images/eye-solid.svg';
    } else {
        obText.type = 'password';
        eyeBtn.src = '../images/eye-slash-solid.svg';
    }
});

// Jump through fieldsets(next & pervous buttons)
let fieldSets = document.querySelectorAll('form fieldset');

function jumpToStep(index) {
    fieldSets.forEach((fieldset, i) => {
        fieldset.style.display = i === index ? 'flex' : 'none';
    });
}

// Initialize to show the first fieldset
jumpToStep(0);

// Change registration type customer to Driver & Driver to Customer
let toggleBtn = document.getElementById('toggleBtn');

toggleBtn.addEventListener('click', () => {
    let toggleValue = document.getElementById('regType');
    let hiddenInput = document.getElementById('reg_type');

    if (toggleValue.textContent === 'Customer') {
        toggleValue.textContent = 'Driver';
        document.body.style.backgroundImage = "url('../images/signUpAsClientBg.jpg')";
        document.getElementById('regTopic').textContent = 'Customer';
        document.querySelector('.driverBlock').style.display = 'none';
        hiddenInput.value = 'customers';
    } else {
        toggleValue.textContent = 'Customer';
        document.body.style.backgroundImage = "url('../images/signUpAsDriverBg.jpg')";
        document.getElementById('regTopic').textContent = 'Driver';
        document.querySelector('.driverBlock').style.display = 'flex';
        hiddenInput.value = 'drivers';
    }
});
</script>

</body>
</html>
