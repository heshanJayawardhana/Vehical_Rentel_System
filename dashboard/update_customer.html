<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> | Edite Profile | Easy Ride Rentals</title>
    <link rel="stylesheet" href="./styles/update_customer.css">
</head>
<body>
    
    <main>
        <div class="form_frame">
            <h1>Update Customer</h1>
            <form action="./update_customer_action.php" method="post">
                <section>
                    <fieldset>
                        <div class="form_box">
                            <label for="">First Name :</label>
                            <input type="text" name="f_name" id="f_name">
                        </div>
                        <div class="form_box">
                            <label for="">NIC No. :</label>
                            <input type="text" name="nic" id="nic">
                        </div>
                        <div class="form_box">
                            <label for="">Contact :</label>
                            <input type="text" name="contact" id="contact">
                        </div>
                    </fieldset>
                    <fieldset>
                        <div class="form_box">
                            <label for="">Last Name :</label>
                            <input type="text" name="l_name" id="l_name">
                        </div>
                        <div class="form_box">
                            <label for="">Licence :</label>
                            <input type="text" name="licen" id="licen">
                        </div>
                        <div class="form_box">
                            <label for="">Email :</label>
                            <input type="text" name="email" id="email">
                        </div>
                    </fieldset>
                </section>
                <div class="form_box">
                    <label for="">Address :</label>
                    <textarea name="address" id="address"></textarea>
                </div>
                <div class="form_box">
                    <label for="img">
                        <img src="" alt="profile_picture">
                        <input type="file" name="img" id="img" hidden>
                    </label>
                </div>
                
                <div class="button_row">
                    <button type="reset">cancel</button>
                    <button type="submit">update</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
